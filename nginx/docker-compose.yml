services:

  dwdm-dashboard:
    build: ../Gain_calculator_docker
    container_name: dwdm-dashboard
    restart: unless-stopped
    ports:
      - "8090:8090"
    networks:
      - app-network

  oa-dashboard:
    build: ../OA-dashboard
    container_name: oa-dashboard
    restart: unless-stopped
    ports:
      - "8080:5000"
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./index.html:/usr/share/nginx/html/index.html   # 🔥 IMPORTANT
    depends_on:
      - dwdm-dashboard
      - oa-dashboard
    networks:
      - app-network

networks:
  app-network:
    driver: bridge