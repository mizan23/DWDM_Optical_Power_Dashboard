events {}

http {
    server {
        listen 80;

        # Homepage
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        # ================= DWDM =================
        location /dwdm/ {
            proxy_pass http://dwdm-dashboard:8090/;
            rewrite ^/dwdm/(.*)$ /$1 break;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # DWDM API
        location /single_amp {
            proxy_pass http://dwdm-dashboard:8090/single_amp;
        }

        # ================= OA =================
        location /oa/ {
            proxy_pass http://oa-dashboard:5000/;
            rewrite ^/oa/(.*)$ /$1 break;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # OA API
        location /calculate/ {
            proxy_pass http://oa-dashboard:5000/calculate/;
        }

        # 🔥 FIX: Static files (OA images, CSS, JS)
        location /static/ {
            proxy_pass http://oa-dashboard:5000/static/;
        }
    }
}